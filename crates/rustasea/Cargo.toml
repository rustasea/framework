[package]
name = "rustasea"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RustaSea umbrella crate — Laravel-inspired developer experience for Rust with typed re-exports of the framework"

# Cargo convention: a binary named `cargo-rustasea` makes the facade crate
# invocable as `cargo rustasea <command>` (mirroring `cargo artisan`). The bin
# lives in the facade so plain `cargo install rustasea` ships the scaffolder;
# `required-features` keeps it out of builds that disable `scaffold`.
[[bin]]
name = "cargo-rustasea"
path = "src/bin/cargo-rustasea.rs"
required-features = ["scaffold"]

[dependencies]
rustasea-foundation = { path = "../rustasea-foundation" }
rustasea-config = { path = "../rustasea-config" }
rustasea-router = { path = "../rustasea-router" }
rustasea-http = { path = "../rustasea-http" }
rustasea-macros = { path = "../rustasea-macros" }
rustasea-orm = { path = "../rustasea-orm" }
# OpenAPI 3.1 generation from the live route table (ADOPT-011).
rustasea-openapi = { path = "../rustasea-openapi" }
# Activity log / audit trail (M2): model-change history with causer + diffs.
rustasea-activitylog = { path = "../rustasea-activitylog" }
# Authentication log (ADOPT-003): login/logout/failed/lockout history with an
# optional queued new-device notification.
rustasea-authlog = { path = "../rustasea-authlog" }
rustasea-auth = { path = "../rustasea-auth" }
rustasea-validation = { path = "../rustasea-validation" }
rustasea-queue = { path = "../rustasea-queue" }
rustasea-cache = { path = "../rustasea-cache" }
rustasea-events = { path = "../rustasea-events" }
rustasea-schedule = { path = "../rustasea-schedule" }
# Internationalization (M3): TOML/JSON dictionaries, `__` / `trans_choice`.
rustasea-i18n = { path = "../rustasea-i18n" }
# Timezone mapper (ADOPT-006): user-timezone resolution + wall-clock helpers.
rustasea-timezone = { path = "../rustasea-timezone" }
rustasea-cli = { path = "../rustasea-cli" }
rustasea-testing = { path = "../rustasea-testing" }
# M6 advanced crates (Sprint 07). rustasea-ai is opt-in (NFR-Sca-02):
# core builds never pull AI/provider SDKs without the `ai` feature.
rustasea-broadcast = { path = "../rustasea-broadcast" }
rustasea-storage = { path = "../rustasea-storage" }
rustasea-search = { path = "../rustasea-search" }
rustasea-jsonapi = { path = "../rustasea-jsonapi" }
rustasea-ai = { path = "../rustasea-ai", optional = true }
# Mail (M6): Mailable/Mailer contracts and queued notifications. Always linked
# because `rustasea-authlog` already depends on it; the SMTP transport and the
# template hook stay opt-in behind `mail-smtp` / `mail-templates`.
rustasea-mail = { path = "../rustasea-mail" }
# MongoDB document store (ADR-0010); opt-in so the core build never links the
# `mongodb`/`bson` driver tree (pay-for-what-you-use, NFR-Sca-02).
rustasea-mongo = { path = "../rustasea-mongo", optional = true }
# M6 server-side view layer (askama default); opt-in to preserve
# pay-for-what-you-use (blueprint §3).
rustasea-view = { path = "../rustasea-view", optional = true }
# M6/M7 Inertia protocol + starter-kit surface (ADR-0002). Every crate stays
# optional so the core never links a template engine, WASM framework, or the
# scaffolder unless a feature selects it.
rustasea-inertia = { path = "../rustasea-inertia", optional = true }
rustasea-inertia-client = { path = "../rustasea-inertia-client", optional = true }
rustasea-inertia-adapters = { path = "../rustasea-inertia-adapters", optional = true }
rustasea-livewire = { path = "../rustasea-livewire", optional = true }
rustasea-scaffold = { path = "../rustasea-scaffold", optional = true }
# Argument parsing for the `cargo-rustasea` scaffolder bin; optional so a build
# without the `scaffold` feature never links clap.
clap = { workspace = true, optional = true }
# Logging facade (CFG-005): Laravel-style `logging.toml` channels on tracing.
# Opt-in so the core build never links the tracing subscriber tree
# (pay-for-what-you-use, NFR-Sca-02).
rustasea-logging = { path = "../rustasea-logging", optional = true }
# Dev request profiler / debug toolbar (ADOPT-009). Opt-in so the core build
# never links the profiler; the app enables it via its own `debugbar` feature.
rustasea-debugbar = { path = "../rustasea-debugbar", optional = true }
# Queue dashboard (ADOPT-021): metrics history + failed-job management surface.
# Opt-in so the core build never links the dashboard crate; consumers re-export
# it as `queue_dashboard` via the matching feature.
rustasea-queue-dashboard = { path = "../rustasea-queue-dashboard", optional = true }
# Excel/CSV import-export (ADOPT-023). Opt-in so the core build never links the
# spreadsheet stack (csv/calamine/rust_xlsxwriter); consumers re-export it as
# `excel` via the matching feature.
rustasea-excel = { path = "../rustasea-excel", optional = true }
# Image manipulation (ADOPT-024). Opt-in so the core build never links the
# image codec stack (image crate); consumers re-export it as `image` via the
# matching feature.
rustasea-image = { path = "../rustasea-image", optional = true }
# Action pattern (ADOPT-028). Opt-in so the core build never links the action
# adapters; consumers re-export it as `action` via the matching feature.
rustasea-action = { path = "../rustasea-action", optional = true }
# Google service-account auth (ADOPT-026). Opt-in so the core build never links
# the RSA/PEM signing stack; consumers re-export it as `google` via the matching
# feature.
rustasea-google = { path = "../rustasea-google", optional = true }
# Modular application support (ADOPT-027). Opt-in so the core build never links
# the module registry; consumers re-export it as `modules` via the matching
# feature, which is what `make:module` scaffolds depend on.
rustasea-modules = { path = "../rustasea-modules", optional = true }

[features]
# `scaffold` is on by default so plain `cargo install rustasea` ships the
# `cargo-rustasea` binary (`cargo rustasea new`); builds that opt out with
# `--no-default-features` skip both the scaffolder library and clap.
default = ["scaffold"]
# Server-side views (askama compile-time templates).
view = ["dep:rustasea-view"]
# Forward the runtime engine feature for dev hot-reload / user-authored views.
view-runtime-templates = ["view", "rustasea-view/runtime-templates"]
# Inertia server protocol (axum glue enabled by the crate's default `server`).
inertia = ["dep:rustasea-inertia"]
# Framework-agnostic Inertia WASM client protocol surface.
inertia-client = ["dep:rustasea-inertia-client"]
# Inertia WASM presentation adapter — React variant mapped to Dioxus (ADR-0002 §4).
wasm-dioxus = [
    "inertia-client",
    "dep:rustasea-inertia-adapters",
    "rustasea-inertia-adapters/react",
]
# Inertia WASM presentation adapter — Vue variant mapped to Leptos (ADR-0002 §4).
wasm-leptos = [
    "inertia-client",
    "dep:rustasea-inertia-adapters",
    "rustasea-inertia-adapters/vue",
]
# Inertia WASM presentation adapter — Svelte variant mapped to Sycamore (ADR-0002 §4).
wasm-sycamore = [
    "inertia-client",
    "dep:rustasea-inertia-adapters",
    "rustasea-inertia-adapters/svelte",
]
# Livewire analogue: askama components, HTMX swaps, broadcast realtime (ADR-0002 §5).
livewire = ["view", "dep:rustasea-livewire"]
# Starter-kit scaffolder behind `cargo rustasea new` (ADR-0002 §6).
scaffold = ["dep:rustasea-scaffold", "dep:clap"]
# M6 AI SDK is additive; `ai-search`/`ai-storage`/`ai-mcp` forward the
# deferred-loader features of rustasea-ai itself.
ai = ["dep:rustasea-ai"]
# Mail SMTP transport (`lettre`, TLS via rustls). Forwards to `rustasea-mail`'s
# `smtp` feature; off by default (pay-for-what-you-use, NFR-Sca-02).
mail-smtp = ["rustasea-mail/smtp"]
# Mail template rendering hook (AUTH-018). Forwards to `rustasea-mail`'s
# `templates` feature, which renders mailables through the runtime view engine.
mail-templates = ["view-runtime-templates", "rustasea-mail/templates"]
ai-search = ["dep:rustasea-ai", "rustasea-ai/search"]
ai-storage = ["dep:rustasea-ai", "rustasea-ai/storage"]
# `ai-mcp` also enables the CLI's `mcp:serve` command (ADOPT-015) so an
# application using the umbrella exposes its knowledge surface over MCP.
ai-mcp = ["dep:rustasea-ai", "rustasea-ai/mcp", "rustasea-cli/mcp"]
# MongoDB document store (ADR-0010). Opt-in so the core build never links the
# `mongodb`/`bson` driver tree (NFR-Sca-02).
mongo = ["dep:rustasea-mongo"]
# Logging facade (CFG-005). Opt-in so the core build never links the tracing
# subscriber/appender tree (NFR-Sca-02).
logging = ["dep:rustasea-logging"]
# Sentry error tracking (ADOPT-004). Forwards the `sentry` feature to the HTTP
# request-context middleware and the logging facade's Sentry layer/client.
# Opt-in (NFR-Sca-02).
sentry = ["rustasea-http/sentry", "rustasea-logging/sentry"]
# Dev request profiler / debug toolbar (ADOPT-009). Opt-in so the core build
# never links the profiler; consumers re-export the crate as `debugbar`.
debugbar = ["dep:rustasea-debugbar"]
# Queue dashboard (ADOPT-021). Opt-in so the core build never links the
# dashboard crate; consumers re-export the crate as `queue_dashboard`.
queue-dashboard = ["dep:rustasea-queue-dashboard"]
# Excel/CSV import-export (ADOPT-023). Opt-in so the core build never links the
# spreadsheet stack; consumers re-export the crate as `excel`.
excel = ["dep:rustasea-excel"]
# Image manipulation (ADOPT-024). Opt-in so the core build never links the
# image codec stack; consumers re-export the crate as `image`.
image = ["dep:rustasea-image"]
# Action pattern (ADOPT-028). Opt-in so the core build never links the action
# adapters; consumers re-export the crate as `action`.
action = ["dep:rustasea-action"]
# Google service-account auth (ADOPT-026). Opt-in so the core build never links
# the RSA/PEM signing stack; consumers re-export the crate as `google`.
google = ["dep:rustasea-google"]
# Modular application support (ADOPT-027). Opt-in so the core build never links
# the module registry; consumers re-export the crate as `modules`.
modules = ["dep:rustasea-modules"]
# Broadcast Redis fan-out driver (ADOPT-022). Forwards to `rustasea-broadcast`'s
# `redis` feature so `rustasea::broadcast` exposes the cross-process Pub/Sub
# driver; off by default (pay-for-what-you-use, NFR-Sca-02).
broadcast-redis = ["rustasea-broadcast/redis"]
# Broadcast Pusher HTTP driver (ADOPT-022). Forwards to `rustasea-broadcast`'s
# `pusher` feature so the Pusher protocol + client-auth surface is available.
broadcast-pusher = ["rustasea-broadcast/pusher"]
# SFTP storage disk (ADOPT-025). Forwards to `rustasea-storage`'s `sftp` feature
# so `rustasea::storage` exposes the pure-Rust `russh`-backed SFTP disk; off by
# default (pay-for-what-you-use, NFR-Sca-02).
storage-sftp = ["rustasea-storage/sftp"]
# S3 storage disk. Forwards to `rustasea-storage`'s `aws` feature so `s3` disks
# (AWS or an S3-compatible service such as RustFS, MinIO, or R2) can be built
# from `config/storage.toml`; off by default (pay-for-what-you-use, NFR-Sca-02).
storage-s3 = ["rustasea-storage/aws"]
# Locale-aware fake-data generation (ADOPT-012). Forwards to the testing crate's
# opt-in `faker` feature so `rustasea::testing::faker` is available; off by
# default (pay-for-what-you-use, NFR-Sca-02).
faker = ["rustasea-testing/faker"]
# Composite: every server-side presentation layer plus the scaffolder. The WASM
# variants stay opt-in because an app selects exactly one (ADR-0002 §4), and
# `ai` is excluded so `full` never pulls provider SDKs (NFR-Sca-02).
full = [
    "view",
    "view-runtime-templates",
    "inertia",
    "inertia-client",
    "livewire",
    "scaffold",
]
# Real Docker-backed feature tests (testcontainers + Postgres). Off by default
# so the default `cargo test` never requires Docker.
integration = ["rustasea-testing/postgres", "rustasea-orm/postgres"]
# Browser (WebDriver) e2e harness (ADOPT-029). Forwards to the testing crate's
# `browser` feature so `rustasea::testing::browser` is available; off by default
# because it links a WebDriver client and needs a live chromedriver/geckodriver
# (NFR-Sca-02).
browser = ["rustasea-testing/browser"]

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
