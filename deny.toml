# cargo-deny configuration (ADOPT-030).
#
# Enforces the supply-chain gate: security advisories, license allow-list,
# banned crates / duplicate versions, and source provenance. Run locally with
# `cargo deny check` (install: `cargo install cargo-deny`); CI runs the same
# check in .github/workflows/ci.yml.

[graph]
# Empty `targets` means "analyse every target" (all platforms / cfg combos).
targets = []

[advisories]
# Declare the schema generation so future cargo-deny upgrades flag config drift.
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked crate in the lockfile is never acceptable.
yanked = "deny"
# Unmaintained-crate scope (cargo-deny 0.21): "workspace" fails only for
# unmaintained crates that are direct dependencies of a workspace crate.
# Transitive unmaintained crates (for example `number_prefix` via `indicatif`
# and `proc-macro-error2` via `validator_derive`) carry no known vulnerability,
# so they surface without failing the gate. Actual vulnerabilities always fail
# regardless of this setting.
unmaintained = "workspace"
# Documented exceptions. Only genuine, reviewed exceptions belong here, each
# with an inline reason (see below).
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack" timing sidechannel in `rsa` private-key
    # operations, patched in `rsa` 0.10. `jsonwebtoken` 12 and `russh` already
    # resolve to 0.10; the affected 0.9 line remains only through `sqlx-mysql`
    # 0.8 (the opt-in `mysql` feature) and as a test-only dev-dependency of
    # `rustasea-google`. `sqlx-mysql` uses it to encrypt the password with the
    # server's public key, which is not the private-key operation the advisory
    # covers. Drop this entry when `sqlx` moves to 0.9 (see RUSTSEC-2026-0459).
    { id = "RUSTSEC-2023-0071", reason = "`rsa` 0.9 remains only via sqlx-mysql 0.8 (public-key password encryption, not the affected private-key path) and a test-only dev-dependency; fixed by sqlx 0.9" },
    # RUSTSEC-2026-0459 — CVE-2026-119375 in the SQLite source bundled by
    # `libsqlite3-sys` before 0.39. The bundled copy is not optional: the
    # `sqlite` feature is on by default for `rustasea-activitylog` and
    # `rustasea-authlog` (and in `rustasea-search`'s test build), forwarding
    # rustasea-orm/sqlite -> sqlx/sqlite -> sqlx-sqlite, which compiles
    # `libsqlite3-sys` with `bundled`, so the vulnerable code ships in the
    # default workspace build. `sqlx` 0.8 pins `libsqlite3-sys` 0.30, and the
    # first `sqlx` line on a patched binding (0.9) declares
    # `rust-version = 1.94`, above the workspace MSRV of 1.88 (ADR-0001).
    # sqlx's `sqlite-unbundled` feature (0.8.6), which per the advisory leaves a
    # system-SQLite build unaffected, was considered and rejected: it needs a
    # system libsqlite3 plus bindgen/libclang, is non-hermetic, and complicates
    # cross-compilation. Per the advisory, only a process that opens a database
    # file (with its `-wal`) written by a less trusted party is exposed. Drop
    # this entry when the MSRV allows `sqlx` 0.9.
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite is compiled by default (rustasea-activitylog/authlog default `sqlite`) and no patched `libsqlite3-sys` is reachable under MSRV 1.88: sqlx 0.8 pins 0.30 and sqlx 0.9 needs rustc 1.94; `sqlite-unbundled` rejected as non-hermetic (system libsqlite3 + bindgen); exposure needs an untrusted database file with its -wal" },
    # RUSTSEC-2026-0543 / RUSTSEC-2026-0555 — `chrono` and `chrono-tz` are
    # flagged unmaintained (no vulnerability). Both are direct dependencies used
    # across the workspace, and `sqlx`'s `chrono` feature carries timestamps
    # through the ORM, so replacing them is a migration of its own rather than a
    # dependency bump. Accepted until that migration is scheduled.
    { id = "RUSTSEC-2026-0543", reason = "`chrono` is unmaintained, not vulnerable; it is used across the workspace and through sqlx's `chrono` feature, so replacing it is a separate migration" },
    { id = "RUSTSEC-2026-0555", reason = "`chrono-tz` is unmaintained, not vulnerable; it follows the `chrono` migration" },
]

[licenses]
# Require high-confidence license detection before accepting a crate.
confidence-threshold = 0.9
# Allow-list of SPDX licenses present in the dependency graph. Every entry is
# a permissive license; no copyleft-only licenses are permitted. The single
# OR-expression in the graph (`r-efi`: "MIT OR Apache-2.0 OR LGPL-2.1-or-later")
# passes because at least one branch (MIT/Apache-2.0) is allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
exceptions = []

[bans]
# The lock has many crates with multiple semver-incompatible versions
# (windows-sys x5, hashbrown x4, base64 x3, rand x3, …). These are a natural
# consequence of the dependency tree, so duplicates warn rather than fail.
multiple-versions = "warn"
# Wildcard *registry* requirements (`serde = "*"`) are flagged, but the lint
# must be a warning here: cargo-deny also treats the workspace's own
# unversioned `path` dependencies (`rustasea = { path = "../rustasea" }`) as
# wildcards, and its `allow-wildcard-paths` escape hatch only applies to
# non-publishable crates (crates.io forbids path deps). This is the standard
# intra-workspace pattern, so we surface wildcards as warnings rather than
# failing the gate. Hardening step: add `version` fields to the path deps.
wildcards = "warn"
deny = []
skip = []

[sources]
# Only crates.io is a trusted source; no unknown registries or git sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
