# cargo-audit configuration (ADOPT-030).
#
# Mirrors the advisory allow-list in deny.toml so `cargo audit` (CI `audit` job)
# and `cargo deny check advisories` agree on the accepted exceptions.

[advisories]
# Documented, reviewed exceptions only.
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack" timing sidechannel in `rsa`
    # private-key operations, patched in `rsa` 0.10. The affected 0.9 line
    # remains only through `sqlx-mysql` 0.8 (public-key password encryption) and
    # a test-only dev-dependency of `rustasea-google`. See deny.toml.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0459 — CVE-2026-119375 in the SQLite bundled by
    # `libsqlite3-sys` before 0.39. `sqlx` 0.8 pins 0.30 and `sqlx` 0.9 needs
    # rustc 1.94, above the workspace MSRV of 1.88. See deny.toml.
    "RUSTSEC-2026-0459",
]
